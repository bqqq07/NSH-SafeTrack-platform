{% extends "base.html" %}
{% block content %}
<h1>Reports</h1>
<section class="card">
  <form method="post" action="{{ url_for('admin_report_picker') }}" class="grid3"> 
  <!-- هذا يرسل POST لنفس الراوت، وهو بدوره يعمل redirect إلى admin_reports_all -->
    <label>Week Start (Sunday)
      <input type="date" name="week_start" value="{{ ws.isoformat() }}" required>
    </label>
    <label>Week End (Thursday)
      <input type="date" name="week_end" value="{{ we.isoformat() }}" required>
    </label>
    <div class="align-end">
      <button class="btn primary">Open Supervisor Report</button>
    </div>
  </form>
  <p class="muted">Tip: Reports require a full Sun→Thu week.</p>
</section>
{% endblock %}
