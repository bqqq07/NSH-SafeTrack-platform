{% extends "base.html" %}
{% block title %}PTW Reports{% endblock %}
{% block content %}
<style>
.pk-title{font-size:18px;font-weight:700;margin-bottom:4px}
.pk-sub{font-size:12px;color:var(--muted);margin-bottom:24px}
.pk-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:600px}
.pk-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:20px}
.pk-card-title{font-size:14px;font-weight:700;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:#374151}
input[type=date],select{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #e2e8f0;font-size:13px;margin-bottom:12px}
.btn-go{width:100%;padding:11px;border:none;background:#0f172a;color:#fff;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
@media(max-width:500px){.pk-grid{grid-template-columns:1fr}}
</style>
<div class="pk-title">PTW Training Reports</div>
<div class="pk-sub">Select report type and period</div>
<div class="pk-grid">
  <div class="pk-card">
    <div class="pk-card-title">📅 Weekly Report</div>
    <form action="{{ url_for('ptw_report_weekly') }}" method="get">
      <label>Week start (Sunday)</label>
      <input type="date" name="week_start" value="{{ today.isoformat() }}" required>
      <button type="submit" class="btn-go">View Weekly →</button>
    </form>
  </div>
  <div class="pk-card">
    <div class="pk-card-title">🗓️ Monthly Report</div>
    <form action="{{ url_for('ptw_report_monthly') }}" method="get">
      <label>Year</label>
      <select name="year">
        {% for y in range(today.year, today.year - 3, -1) %}
        <option value="{{ y }}" {% if y == today.year %}selected{% endif %}>{{ y }}</option>
        {% endfor %}
      </select>
      <label>Month</label>
      <select name="month">
        {% for m in range(1,13) %}
        <option value="{{ m }}" {% if m == today.month %}selected{% endif %}>
          {{ ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m] }}
        </option>
        {% endfor %}
      </select>
      <button type="submit" class="btn-go">View Monthly →</button>
    </form>
  </div>
</div>
<div style="margin-top:20px">
  <a href="{{ url_for('ptw_progress_report') }}"
     style="font-size:13px;color:#3b82f6;text-decoration:none">→ Full progress overview (all trainees)</a>
</div>
{% endblock %}
