{% extends "base.html" %}
{% block title %}New Daily Work Report{% endblock %}
{% block content %}
<section class="card">
  <h2>New Daily Work Report</h2>

  <form method="POST" enctype="multipart/form-data" id="reportForm" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="employee_ids" id="employeeIds">

    <!-- Date + Notes -->
    <div class="grid2">
      <label>Report Date
        <input type="date" name="report_date" value="{{ today.isoformat() }}" required>
      </label>
      <label>General Notes (optional)
        <input type="text" name="notes" placeholder="e.g. weather, general observations…">
      </label>
    </div>

    <!-- ── Employees section ── -->
    <div style="background:#f0f8ff;border:1px solid #bde0f8;border-radius:8px;padding:14px;margin-top:10px">
      <div style="font-weight:700;font-size:15px;color:#1e3a5f;margin-bottom:10px">👷 Employees on this Report</div>

      <!-- Selected employees chips -->
      <div id="selectedChips" style="display:flex;flex-wrap:wrap;gap:6px;min-height:32px;margin-bottom:10px"></div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
        <!-- Search by ID -->
        <label style="margin:0;flex:1;min-width:160px">Search by Employee ID
          <div style="display:flex;gap:6px">
            <input type="text" id="empSearch" placeholder="Enter employee number…" autocomplete="off"
                   style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();lookupEmployee()}">
            <button type="button" class="btn primary" onclick="lookupEmployee()">Search</button>
          </div>
        </label>

        {% if my_employees %}
        <!-- Select from my employees -->
        <label style="margin:0;flex:1;min-width:200px">Or pick from your employees
          <div style="display:flex;gap:6px">
            <select id="empPicker" style="flex:1">
              <option value="">— Select employee —</option>
              {% for e in my_employees %}
              <option value="{{ e.id }}" data-name="{{ e.name }}" data-num="{{ e.emp_number }}" data-dept="{{ e.department or '' }}">
                {{ e.name }} ({{ e.emp_number }})
              </option>
              {% endfor %}
            </select>
            <button type="button" class="btn primary" onclick="addFromPicker()">Add</button>
          </div>
        </label>
        {% endif %}
      </div>

      <div id="empMsg" style="margin-top:6px;font-size:13px;min-height:18px"></div>
    </div>

    <hr style="margin:18px 0;border:0;border-top:1px solid var(--border)">

    <!-- Work Items -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <h3 style="margin:0">Work Items</h3>
      <button type="button" class="btn primary" onclick="addItem()">+ Add Work Item</button>
    </div>
    <div id="itemsContainer"></div>

    <div class="actions" style="margin-top:20px">
      <button class="btn primary" type="submit">Save Report</button>
      <a class="btn" href="{{ url_for('supervisor_daily_work_list') }}">Cancel</a>
    </div>
  </form>
</section>

<!-- Work item template -->
<template id="itemTemplate">
  <div class="work-item card" style="margin-bottom:14px;border-left:4px solid var(--primary)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <strong>Work Item #<span class="item-num"></span></strong>
      <button type="button" class="btn" style="padding:4px 10px;font-size:12px;color:var(--danger)" onclick="removeItem(this)">Remove</button>
    </div>
    <div class="grid2">
      <label>Area / Zone <span style="color:var(--danger)">*</span>
        <input type="text" name="area[]" placeholder="e.g. Zone A, Building 3…" required>
      </label>
      <div class="grid2" style="gap:8px">
        <label>Start Time<input type="time" name="start_time[]"></label>
        <label>End Time<input type="time" name="end_time[]"></label>
      </div>
    </div>
    <label style="margin-top:8px">Work Description <span style="color:var(--danger)">*</span>
      <textarea name="description[]" rows="3" placeholder="Describe the work performed…" required style="width:100%"></textarea>
    </label>
    <div style="margin-top:10px">
      <div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px">
        Photos <span style="font-weight:400">(optional)</span>
        <button type="button" class="add-photo-btn btn"
                style="padding:3px 10px;font-size:12px;margin-left:8px"
                onclick="addPhotoSlot(this)">+ Add Photo</button>
      </div>
      <div class="photo-slots" style="display:flex;flex-direction:column;gap:6px"></div>
      <div class="photo-previews" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
    </div>
  </div>
</template>

<style>
.emp-chip {
  display:inline-flex;align-items:center;gap:6px;
  background:#1e3a5f;color:#fff;border-radius:20px;
  padding:4px 12px;font-size:13px;
}
.emp-chip button {
  background:none;border:none;color:#aad4f5;cursor:pointer;
  font-size:15px;line-height:1;padding:0 0 0 2px;
}
.emp-chip button:hover{color:#fff}
.work-item .photo-previews img{width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
</style>

<script>
// ── Employees ────────────────────────────────────────
const selected = {};   // id -> {name, emp_number, dept}

function renderChips() {
  const box = document.getElementById('selectedChips');
  box.innerHTML = '';
  Object.entries(selected).forEach(([id, emp]) => {
    const chip = document.createElement('span');
    chip.className = 'emp-chip';
    chip.innerHTML = `👷 <strong>${emp.name}</strong> <small style="opacity:.75">${emp.emp_number}</small>
      <button type="button" onclick="removeEmployee('${id}')" title="Remove">✕</button>`;
    box.appendChild(chip);
  });
  // sync hidden input
  document.getElementById('employeeIds').value = Object.keys(selected).join(',');
}

function addEmployee(id, name, emp_number, dept) {
  id = String(id);
  if (selected[id]) {
    showEmpMsg(`${name} is already added.`, 'warning');
    return;
  }
  selected[id] = {name, emp_number, dept};
  renderChips();
  showEmpMsg(`Added: ${name}`, 'success');
}

function removeEmployee(id) {
  delete selected[id];
  renderChips();
  document.getElementById('empMsg').innerHTML = '';
}

function showEmpMsg(msg, type) {
  const colors = {success:'#2e7d32', warning:'#b45309', danger:'#c62828'};
  document.getElementById('empMsg').innerHTML =
    `<span style="color:${colors[type]||'#555'}">${msg}</span>`;
  setTimeout(() => { document.getElementById('empMsg').innerHTML = ''; }, 3000);
}

async function lookupEmployee() {
  const val = document.getElementById('empSearch').value.trim();
  if (!val) { showEmpMsg('Please enter an employee ID.', 'danger'); return; }
  showEmpMsg('Searching…', '');
  try {
    const res = await fetch(`/api/employee/lookup?emp_number=${encodeURIComponent(val)}`);
    const data = await res.json();
    if (res.ok) {
      addEmployee(data.id, data.name, data.emp_number, data.department || '');
      document.getElementById('empSearch').value = '';
    } else {
      showEmpMsg('Employee not found. Check the ID and try again.', 'danger');
    }
  } catch(e) {
    showEmpMsg('Network error. Please try again.', 'danger');
  }
}

function addFromPicker() {
  const sel = document.getElementById('empPicker');
  const opt = sel.options[sel.selectedIndex];
  if (!opt || !opt.value) { showEmpMsg('Please select an employee.', 'warning'); return; }
  addEmployee(opt.value, opt.dataset.name, opt.dataset.num, opt.dataset.dept || '');
  sel.selectedIndex = 0;
}

// ── Work items ────────────────────────────────────────
let itemCount = 0;

function addItem() {
  const clone = document.getElementById('itemTemplate').content.cloneNode(true);
  itemCount++;
  clone.querySelector('.item-num').textContent = itemCount;
  document.getElementById('itemsContainer').appendChild(clone);
  renumberItems();
  // auto-add first photo slot
  const newItem = document.querySelectorAll('.work-item');
  const lastItem = newItem[newItem.length - 1];
  addPhotoSlot(lastItem.querySelector('.add-photo-btn'));
}

function removeItem(btn) {
  btn.closest('.work-item').remove();
  renumberItems();
}

function renumberItems() {
  document.querySelectorAll('.work-item').forEach((item, i) => {
    item.querySelector('.item-num').textContent = i + 1;
    // rename all photo inputs inside this item
    item.querySelectorAll('.photo-slot-input').forEach(fi => {
      fi.name = `photos_${i}[]`;
    });
  });
}

function addPhotoSlot(btn) {
  const item = btn.closest('.work-item');
  const i = getItemIndex(item);
  const slots = item.querySelector('.photo-slots');
  const previews = item.querySelector('.photo-previews');

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:center;gap:6px';

  const inp = document.createElement('input');
  inp.type = 'file';
  inp.name = `photos_${i}[]`;
  inp.accept = 'image/jpeg,image/png,image/webp';
  inp.className = 'photo-slot-input';
  inp.style.cssText = 'flex:1;padding:5px;border:1px solid var(--border);border-radius:8px';

  const del = document.createElement('button');
  del.type = 'button';
  del.textContent = '✕';
  del.style.cssText = 'background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;padding:0 4px';
  del.onclick = () => { row.remove(); };

  inp.addEventListener('change', function() {
    // preview in the previews area
    const file = this.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    const r = new FileReader();
    r.onload = e => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;display:inline-block';
      const img = document.createElement('img');
      img.src = e.target.result;
      img.style.cssText = 'width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--border)';
      wrap.appendChild(img);
      previews.appendChild(wrap);
    };
    r.readAsDataURL(file);
  });

  row.appendChild(inp);
  row.appendChild(del);
  slots.appendChild(row);
}

function getItemIndex(item) {
  return Array.from(document.querySelectorAll('.work-item')).indexOf(item);
}

addItem();

</script>
{% endblock %}
