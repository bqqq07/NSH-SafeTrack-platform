{% extends "base.html" %}
{% block title %}Welfare Monthly Report{% endblock %}
{% block content %}
<h2>Welfare Monthly Report</h2>
<div class="card" style="max-width:560px">
  <h3 style="margin-top:0">Select Month</h3>
  <form method="get" action="{{ url_for('welfare_report_monthly_view') }}">

    <label>
      Month
      <input type="month" name="month" value="{{ today.strftime('%Y-%m') }}" required
             style="padding:8px;border-radius:8px;border:1px solid #cbd5e1;font-size:1rem;width:100%;box-sizing:border-box">
    </label>

    {% if all_officers %}
    <div style="margin-top:14px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:700;font-size:.88rem">Officers to include</span>
        <span style="display:flex;gap:8px">
          <button type="button" onclick="setAll(true)"
                  style="font-size:.78rem;padding:3px 10px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;cursor:pointer">All</button>
          <button type="button" onclick="setAll(false)"
                  style="font-size:.78rem;padding:3px 10px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;cursor:pointer">None</button>
        </span>
      </div>
      <div style="border:1px solid #e2e8f0;border-radius:10px;padding:10px;max-height:260px;overflow-y:auto">
        {% for o in all_officers %}
        <label style="display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:7px;cursor:pointer"
               onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background=''">
          <input type="checkbox" name="officer_ids" value="{{ o.id }}" checked
                 style="width:15px;height:15px;accent-color:#0f172a">
          <span style="font-size:.9rem;font-weight:600">{{ o.name or o.supervisor_code }}</span>
          <span style="font-size:.78rem;color:#94a3b8">{{ o.supervisor_code }}</span>
        </label>
        {% endfor %}
      </div>
    </div>
    {% endif %}

    <div class="actions" style="margin-top:14px">
      <button class="btn primary">View Report</button>
      <a href="{{ url_for('welfare_report_weekly_picker') }}" class="btn">Weekly Report →</a>
    </div>
  </form>
</div>

<script>
function setAll(val) {
  document.querySelectorAll('input[name=officer_ids]').forEach(function(cb){ cb.checked = val; });
}
</script>
{% endblock %}
