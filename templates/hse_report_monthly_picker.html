{% extends "base.html" %}
{% block content %}
<h2>HSE Monthly Report</h2>
<div class="card" style="max-width:420px">
  <h3 style="margin-top:0">Select Month</h3>
  <form method="get" action="{{ url_for('hse_report_monthly') }}">
    <div class="grid2">
      <label>Year
        <select name="year">
          {% for y in range(today.year, today.year - 3, -1) %}
          <option value="{{ y }}" {{ 'selected' if y == today.year }}>{{ y }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Month
        <select name="month">
          {% set months = ['January','February','March','April','May','June',
                           'July','August','September','October','November','December'] %}
          {% for i in range(1, 13) %}
          <option value="{{ i }}" {{ 'selected' if i == today.month }}>{{ months[i-1] }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div class="actions">
      <button class="btn primary">View Report</button>
      <a href="{{ url_for('hse_report_picker') }}" class="btn">Weekly Report</a>
    </div>
  </form>
</div>
{% endblock %}
