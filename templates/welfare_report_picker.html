{% extends "base.html" %}
{% block title %}Welfare Reports{% endblock %}
{% block content %}
<h2>Welfare Reports</h2>

<form method="get" action="{{ url_for('welfare_report_monthly') }}" style="max-width:360px">
  <div class="form-group">
    <label>Year</label>
    <input type="number" name="year" value="{{ year }}" min="2024" max="2030" class="form-control">
  </div>
  <div class="form-group" style="margin-top:1rem">
    <label>Month</label>
    <select name="month" class="form-control">
      {% for m in range(1,13) %}
      <option value="{{ m }}" {% if m==month %}selected{% endif %}>
        {{ ['','January','February','March','April','May','June',
             'July','August','September','October','November','December'][m] }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div style="margin-top:1.5rem">
    <button type="submit" class="btn">View Report</button>
  </div>
</form>
{% endblock %}
