{% extends "base.html" %}
{% block title %}Log Environmental Incident{% endblock %}
{% block content %}
<div style="max-width:600px;margin:auto;">
  <h2>Log Environmental Incident</h2>
  <form method="POST">
    <div class="card" style="padding:1.5rem;display:grid;gap:1rem;">
      <div>
        <label><strong>Date</strong></label>
        <input type="date" name="date" value="{{ today }}" required
               style="display:block;width:100%;padding:.6rem;border:1px solid #d1d5db;border-radius:.5rem;margin-top:.3rem;">
      </div>
      <div>
        <label><strong>Incident type</strong></label>
        <select name="incident_type" required
                style="display:block;width:100%;padding:.6rem;border:1px solid #d1d5db;border-radius:.5rem;margin-top:.3rem;">
          <option value="">Select...</option>
          <option>Oil or fuel spill</option>
          <option>Chemical spill</option>
          <option>Soil contamination</option>
          <option>Hazardous waste procedure violation</option>
          <option>External sewage leak</option>
          <option>Dust incident</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label><strong>Location</strong></label>
        <input type="text" name="location"
               style="display:block;width:100%;padding:.6rem;border:1px solid #d1d5db;border-radius:.5rem;margin-top:.3rem;">
      </div>
      <div>
        <label><strong>Incident description</strong></label>
        <textarea name="description" rows="4" required
                  style="display:block;width:100%;padding:.6rem;border:1px solid #d1d5db;border-radius:.5rem;margin-top:.3rem;resize:vertical;"></textarea>
      </div>
      <div>
        <label><strong>Action taken</strong></label>
        <textarea name="action_taken" rows="3"
                  style="display:block;width:100%;padding:.6rem;border:1px solid #d1d5db;border-radius:.5rem;margin-top:.3rem;resize:vertical;"></textarea>
      </div>
    </div>
    <div style="margin-top:1rem;display:flex;gap:1rem;">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('env_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
